<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sabores que Ficam | Em breve</title>
<meta name="description" content="O site da Sabores que Ficam está em manutenção. Voltamos em breve.">
<meta name="theme-color" content="#15120f">
<meta name="robots" content="noindex">
<meta property="og:title" content="Sabores que Ficam | Em breve">
<meta property="og:description" content="O site está em manutenção. Voltamos em breve.">
<meta property="og:url" content="https://www.saboresqueficam.pt/">
<meta property="og:image" content="https://www.saboresqueficam.pt/hero-tray.jpg">
<link rel="icon" type="image/png" href="sabores-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ffffff;
  --ink:#15120f;
  --caramel:#c2935b;
  --display:'Libre Caslon Display',Georgia,'Times New Roman',serif;
  --serif:'Libre Caslon Text',Georgia,'Times New Roman',serif;
  --sans:'Montserrat','Helvetica Neue',Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--ink);color:var(--paper);font-family:var(--serif);-webkit-font-smoothing:antialiased}
.stage{position:fixed;inset:0;background:var(--ink)}
.film{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,rgba(21,18,15,.5) 0%,rgba(21,18,15,.72) 62%,rgba(21,18,15,.88) 100%);pointer-events:none}
.content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));gap:clamp(16px,3vh,28px)}
.brand{background:var(--caramel);padding:14px 18px 12px;display:inline-block}
.brand img{height:clamp(44px,7vw,64px);width:auto;display:block}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,6.4vw,4.6rem);line-height:1.04;letter-spacing:-.01em;max-width:16ch}
.sub{font-size:clamp(1rem,1.6vw,1.2rem);line-height:1.55;max-width:38ch;color:rgba(255,255,255,.82)}
.kitchen{display:flex;align-items:center;gap:12px;font-family:var(--sans);font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--caramel)}
.steam{width:30px;height:34px;overflow:visible}
.steam path{fill:none;stroke:var(--caramel);stroke-width:2.2;stroke-linecap:round;opacity:0;animation:rise 2.8s ease-in-out infinite}
.steam path:nth-child(2){animation-delay:.5s}
.steam path:nth-child(3){animation-delay:1s}
@keyframes rise{
  0%{opacity:0;transform:translateY(6px) scaleY(.7)}
  20%{opacity:.9}
  70%{opacity:.5}
  100%{opacity:0;transform:translateY(-10px) scaleY(1.05)}
}
#word{display:inline-block;min-width:11ch;text-align:left}
.tlink{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--paper);padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,.5);transition:opacity .2s,border-color .2s}
.tlink:hover{opacity:.7;border-color:var(--paper)}
.foot{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));z-index:2;text-align:center;font-family:var(--sans);font-size:.62rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.4)}
@media (min-width:900px){ .film.mobile-only{display:none} }
@media (max-width:899px){ .film.desk-only{display:none} }
@media (prefers-reduced-motion:reduce){
  .steam path{animation:none;opacity:.6}
}
</style>
</head>
<body>

<div class="stage">
  <video class="film desk-only" muted loop playsinline autoplay preload="auto" poster="hero-tray.jpg" src="hero-reel.mp4" aria-hidden="true"></video>
  <video class="film mobile-only" muted loop playsinline autoplay preload="auto" poster="hero-tray.jpg" src="hero-reel-mobile.mp4" aria-hidden="true"></video>
</div>

<main class="content">
  <a class="brand" href="https://www.instagram.com/saboresqueficam/" target="_blank" rel="noopener" aria-label="Instagram da Sabores que Ficam"><img src="sabores-logo.png" alt="Sabores que Ficam"></a>
  <h1>Estamos a preparar algo novo.</h1>
  <p class="sub">O nosso site está em manutenção. Enquanto isso, continuamos na cozinha, atentos ao Instagram.</p>
  <p class="kitchen">
    <svg class="steam" viewBox="0 0 30 34" aria-hidden="true">
      <path d="M8 30 C 4 22, 12 18, 8 10"></path>
      <path d="M15 30 C 11 22, 19 18, 15 10"></path>
      <path d="M22 30 C 18 22, 26 18, 22 10"></path>
    </svg>
    <span id="word">a temperar</span>
  </p>
  <a class="tlink" href="https://www.instagram.com/saboresqueficam/" target="_blank" rel="noopener">Seguir @saboresqueficam</a>
</main>

<p class="foot">Sabores que Ficam &middot; Catering e buffet em Lisboa</p>

<script>
(function(){
  var words = ["a temperar","a cozinhar","a provar","a servir","quase pronto"];
  var i = 0;
  var el = document.getElementById('word');
  setInterval(function(){
    i = (i + 1) % words.length;
    el.style.opacity = 0;
    setTimeout(function(){ el.textContent = words[i]; el.style.opacity = 1; }, 260);
  }, 2600);
  el.style.transition = 'opacity .26s ease';

  var desktop = matchMedia('(min-width: 900px)');
  function sync(){
    document.querySelectorAll('video.film').forEach(function(v){
      var shouldPlay = (v.classList.contains('desk-only') && desktop.matches) || (v.classList.contains('mobile-only') && !desktop.matches);
      if(shouldPlay){ var p = v.play(); if(p) p.catch(function(){}); } else { v.pause(); }
    });
  }
  desktop.addEventListener('change', sync);
  sync();
})();
</script>
</body>
</html>
